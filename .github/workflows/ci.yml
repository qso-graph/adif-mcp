name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Cancel superseded runs on the same ref (push or PR) so we don't waste
# minutes when commits land in rapid succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main takes a release PR from develop, or a security branch, and nothing else:
  # merging into main publishes. Required on main by its branch protection.
  release-source:
    name: Release PR source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          case "${{ github.head_ref }}" in
            develop|security/*) echo "ok: ${{ github.head_ref }} -> main" ;;
            *) echo "main takes a release PR from develop, or a security/ branch"; exit 1 ;;
          esac

  # Lint and types, once rather than per Python: both read the source, and
  # neither answer changes with the interpreter running them. The matrix below
  # is for the code's behaviour, which does (qso-graph-devel#66).
  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy src

  # Every version this package says it supports. `requires-python` is `>=3.10`
  # and the classifiers name 3.10 through 3.13; before this they were a claim
  # nothing ran. This package is the ADIF spec engine every other server reads
  # its definitions through, so an interpreter difference here is one that
  # reaches all of them.
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install (locked)
        run: uv sync --group dev --frozen

      - name: Unit tests
        env:
          PYTHONWARNINGS: error
        run: uv run pytest tests --ignore=tests/test_security.py -v

      - name: Security tests
        run: uv run pytest tests/test_security.py -v

      - name: Manifest validate (CLI)
        run: uv run adif-mcp validate-manifest

  ci-all-green:
    name: ci-all-green
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify required jobs all succeeded
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "FAIL: ruff or mypy did not pass (result=${{ needs.lint.result }})"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "FAIL: test matrix did not all succeed (result=${{ needs.test.result }})"
            exit 1
          fi
          echo "All required CI jobs passed."
