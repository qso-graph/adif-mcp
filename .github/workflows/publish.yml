name: Publish to PyPI

# A release happens on purpose, not as a side effect of merging (KI7MT, 2026-10-25).
#
# This used to fire on a push to `main`, which made "merge the release PR" the act of
# publishing — and that is what forced two pull requests per release: one to prepare the
# version, and a second to merge `develop` into `main` and ship it.
#
# Now `main` is the one working branch. Merging into it builds and tests and publishes
# nothing; a release is Actions -> Publish to PyPI -> Run workflow, with the version
# typed in. Typed, because it is a decision: it must match what the tree already says,
# and every gate below refuses anything it cannot confirm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish, e.g. 0.2.1 — must match pyproject.toml"
        required: true
        type: string

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    name: Security gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      # "yes" when this version is on PyPI with no tag: an interrupted release
      # being finished rather than a new one being made.
      resume: ${{ steps.version.outputs.resume }}
    steps:
      - uses: actions/checkout@v5

      # workflow_dispatch offers a branch picker, so unlike the old push trigger this
      # workflow can be started from anywhere. The lock is the pypi Environment's
      # deployment branch rule (main only); this is the same rule stated where a failed
      # run can show it, because an Environment rule rejects the deployment with no
      # explanation of what was wrong.
      - name: This runs from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FAIL: a release is published from main only (this is $GITHUB_REF)"
            exit 1
          fi

      # Merging no longer publishes, so nothing else guarantees that what is about to
      # be released is the code CI passed on. Under the old trigger the release PR had
      # to be green before the merge that published it; this restores that property.
      - name: CI passed on the commit being published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PASSED="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=ci-all-green" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [ "${PASSED:-0}" -lt 1 ]; then
            echo "FAIL: ci-all-green has not passed on ${GITHUB_SHA}"
            exit 1
          fi
          echo "ci-all-green passed on ${GITHUB_SHA}"

      # A release publishes a version that is not out yet. PyPI publishes
      # pyproject's version and the Registry server.json's, so they must agree too.
      # Computed once; every later job uses this value (needs.security.outputs.version).
      # The gate fails closed: anything it cannot confirm stops the release.
      - name: The version is the one asked for, new, and consistent
        id: version
        env:
          # Through the environment rather than interpolated into the script: a
          # ${{ }} expansion inside run: is substituted before the shell sees it, so
          # the input would be script rather than data. Only a writer can dispatch
          # this, and the rule is still input validation on every supplied string.
          ASKED: ${{ inputs.version }}
        run: |
          VERSION="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          if ! printf '%s' "$ASKED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.-]*)$'; then
            echo "FAIL: '$ASKED' is not a version"
            exit 1
          fi
          # Typed by the person releasing, so a slip names a version that is not here
          # rather than shipping whatever happens to be on main.
          if [ "$ASKED" != "$VERSION" ]; then
            echo "FAIL: asked to publish ${ASKED}, but this tree is ${VERSION}"
            exit 1
          fi
          PACKAGE="$(jq -r '.packages[0].identifier' server.json)"
          echo "pyproject=${VERSION} server.json=$(jq -r '.version' server.json)/$(jq -r '.packages[0].version' server.json)"
          if [ "$(jq -r '.version' server.json)" != "$VERSION" ] || [ "$(jq -r '.packages[0].version' server.json)" != "$VERSION" ]; then
            echo "FAIL: server.json does not match pyproject.toml version ${VERSION}"
            exit 1
          fi
          # Only a 404 means "not published yet"; unreachable or 5xx is not a yes.
          # PyPI and the tag are read together, because neither alone says
          # whether this version is releasable.
          #
          # This gate used to refuse on PyPI 200 full stop, and that made every
          # interruption after the upload cost a version. The tag is written by
          # the last job, so a transient failure in between -- the MCP Registry
          # 504s on 2026-10-26, nine bytes served for the mcp-publisher
          # download on 2026-10-27 -- left the version on PyPI, which is
          # immutable, with no tag and no registry entry. The only recovery was
          # to bump and release again, abandoning the version. Three releases
          # went that way.
          #
          # So the four states are named, and only two of them refuse:
          #
          #   PyPI 404, no tag   a new release
          #   PyPI 200, no tag   a release that was interrupted after the
          #                      upload. RESUMABLE: the upload is skipped and
          #                      the remaining jobs finish the release
          #   PyPI 200, tagged   already released
          #   PyPI 404, tagged   a tag with nothing behind it; something is
          #                      wrong and guessing is worse than stopping
          CODE="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json")"
          case "$CODE" in
            404|200) : ;;
            *) echo "FAIL: PyPI returned ${CODE}; cannot tell whether ${VERSION} is published"; exit 1 ;;
          esac
          # git ls-remote --exit-code: 2 means no such tag; anything else (0, 128) stops.
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null
          RC=$?
          set -e
          case "$RC" in
            0) TAGGED=yes ;;
            2) TAGGED=no ;;
            *) echo "FAIL: could not check tags (git ls-remote exited ${RC})"; exit 1 ;;
          esac

          RESUME=false
          if [ "$CODE" = 404 ] && [ "$TAGGED" = no ]; then
            echo "PyPI: ${PACKAGE} ${VERSION} is new, tag v${VERSION} is free"
          elif [ "$CODE" = 200 ] && [ "$TAGGED" = no ]; then
            RESUME=true
            echo "NOTE: ${PACKAGE} ${VERSION} is already on PyPI with no tag v${VERSION}."
            echo "      A previous run uploaded it and did not finish. Resuming:"
            echo "      the PyPI upload is skipped and the registry, verify and"
            echo "      tag jobs will complete this release."
          elif [ "$CODE" = 200 ] && [ "$TAGGED" = yes ]; then
            echo "FAIL: ${PACKAGE} ${VERSION} is on PyPI and tagged v${VERSION} — already released."
            echo "      Bump the version to release again."
            exit 1
          else
            echo "FAIL: tag v${VERSION} exists but PyPI has no ${VERSION}."
            echo "      That is not a state this workflow created; stopping rather than guessing."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "resume=${RESUME}" >> "$GITHUB_OUTPUT"


      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # pip-audit is named here because the audit step below calls it. It was
        # not, so that step exited 127 (`pip-audit: command not found`) and the
        # Security gate failed -- this is the same shape netlogger-mcp and
        # omiss-mcp use, which do install it.
        run: pip install -e ".[test]" pip-audit

      - name: Security tests
        run: python -m pytest tests/test_security.py -v

      - name: Audit dependencies for vulnerabilities
        # Audits this package's declared dependencies, and can fail: a known CVE stops the release.
        # A finding with no fix yet is excepted only explicitly: --ignore-vuln ID, with a reason and date.
        #
        # This repository was the only one in the fleet whose release gate ran no
        # dependency audit at all (measured 2026-10-25). Its three grep checks were
        # also an older, weaker form than the rest of the fleet's, replaced below.
        run: pip-audit --strict --desc on .

      - name: Grep check — no subprocess/shell
        run: |
          # The old form searched "subprocess\|shell=True" and so did not look for
          # os.system at all.
          if grep -rn 'subprocess\.\|os\.system\|shell=True' src/; then
            echo "FAIL: subprocess/shell found in source"
            exit 1
          fi

      - name: Grep check — no plaintext http://
        run: |
          # The old form was `! grep -rn 'http://[^l]'`, meant to skip localhost.
          # What [^l] actually exempts is every host whose name begins with "l":
          # a planted http://leaky.example.com/api passed this gate (measured
          # 2026-10-25). An exemption names the exact thing exempted, never a
          # prefix or a character class — the same defect as qrz-mcp#39, where a
          # hostname exclusion also passed every URL beneath that host.
          #
          # Tests the output rather than the pipeline's exit status, because the
          # output is what this gate is actually asking about: are there any
          # plaintext URLs.
          # The two legitimate http:// strings in this package are the W3C
          # XMLSchema namespace identifier in ADIF's own .xsd files. A namespace
          # identifier is a name, not an address: nothing connects to it, and it
          # must match W3C's byte for byte. Exempted as the whole line, so a real
          # URL cannot ride in beside it, and with the spec directory left open so
          # a new sealed ADIF version does not trip the gate while any change to
          # the line itself does.
          #
          # [[:space:]]*$ rather than a bare $ because ADIF ships these .xsd files
          # with CRLF endings, so the line ends in a carriage return. It still
          # anchors the whole line: only whitespace may follow.
          #
          # Note the old form also passed --include="*.py", so no non-Python file
          # under src/ was ever scanned -- which is why these two .xsd lines had
          # never been seen by this gate at all.
          hits="$(grep -rn 'http://' src/ \
              | grep -v 'localhost\|127\.0\.0\.1\|::1' \
              | grep -vE '^src/adif_mcp/resources/spec/[0-9]+/xml/adifexport\.xsd:[0-9]+:<xs:schema attributeFormDefault="unqualified" elementFormDefault="qualified" xmlns:xs="http://www\.w3\.org/2001/XMLSchema">[[:space:]]*$' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "FAIL: non-HTTPS URL found in source"
            exit 1
          fi

      - name: Grep check — no credential logging
        run: |
          # The old form looked for print.*password and print.*secret only, so an
          # api_key, or anything reaching a logger rather than print, went unseen.
          if grep -rn -i 'print.*password\|print.*api_key\|logging.*password\|logging.*api_key' src/; then
            echo "FAIL: credential logging found in source"
            exit 1
          fi

  publish:
    name: Build and publish to PyPI
    needs: security
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        if: needs.security.outputs.resume != 'true'
        run: pip install build

      - name: Build package
        if: needs.security.outputs.resume != 'true'
        run: python -m build

      - name: Publish to PyPI
        if: needs.security.outputs.resume != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Already on PyPI — resuming
        if: needs.security.outputs.resume == 'true'
        run: |
          # The upload happened in an earlier run that did not finish. PyPI
          # rejects a second upload of the same version anyway, so skipping it
          # is required rather than merely tidy. The jobs after this one are
          # what the resume is for.
          echo "skipped the upload: this version is already on PyPI"

  # ---------------------------------------------------------------------------
  # Registry-publish — pushes server.json to the Official MCP Registry after
  # PyPI publish succeeds, so discovery surfaces stay in sync with PyPI.
  # Canonical template: https://github.com/qso-graph/.github/blob/main/TEMPLATES.md
  # ---------------------------------------------------------------------------
  registry-publish:
    name: Publish to MCP Registry
    needs: [security, publish]  # waits for PyPI publish to succeed
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install jq (server.json bump)
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install mcp-publisher
        run: |
          # Downloaded to a file, not piped into tar, and with --fail.
          #
          # A bare `curl -L | tar xz` cannot fail usefully: curl writes the
          # error body to stdout, so a 404 becomes nine bytes of "Not Found"
          # fed to tar, which exits 2 with "not in gzip format" and says
          # nothing about what actually went wrong. That is what happened on
          # 2026-10-27 at 14:45:53Z -- the asset existed and the URL was right;
          # GitHub served nine bytes for one request. --retry turns that into a
          # retry instead of a failed release.
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
               --output mcp-publisher.tar.gz "$URL"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help > /dev/null  # smoke test

      - name: Set server.json to the released version
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          echo "Setting server.json to ${VERSION}"
          jq --arg v "$VERSION" \
             '.version = $v | .packages[0].version = $v' \
             server.json > /tmp/server.json
          mv /tmp/server.json server.json
          cat server.json

      # The Registry checks PyPI itself and refuses a version PyPI isn't
      # serving yet, which can lag the upload by a minute or more.
      - name: Wait until PyPI serves this version
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          PACKAGE="$(jq -r '.packages[0].identifier' server.json)"
          for i in $(seq 1 40); do
            if curl -fsS "https://pypi.org/pypi/${PACKAGE}/${VERSION}/json" > /dev/null; then
              echo "PyPI serves ${PACKAGE} ${VERSION}"
              exit 0
            fi
            echo "attempt ${i}: PyPI doesn't serve ${PACKAGE} ${VERSION} yet"
            sleep 15
          done
          echo "FAIL: PyPI never served ${PACKAGE} ${VERSION}"
          exit 1

      # One step, because authentication has to happen INSIDE the retry loop.
      #
      # The Registry JWT lives about six minutes. This loop sleeps 30+60+90+120+150
      # seconds and each attempt can take another minute, so it is built to run for
      # roughly twelve. pota-mcp 0.5.0 on 2026-10-26 spent its last two attempts on
      # a dead credential:
      #   17:48:52  login
      #   17:49:53  attempt 1  504   <- the Registry was genuinely down
      #   17:51:28  attempt 2  504
      #   17:53:29  attempt 3  504
      #   17:54:59  attempt 4  401 "token has invalid claims: token is expired"
      #   17:57:00  attempt 5  401
      # PyPI had already accepted the upload, so the run failed after publishing,
      # the tag job never ran, and 0.5.0 is on PyPI untagged and unregistered for
      # good -- PyPI is immutable. The outage was theirs; not surviving it was ours.
      - name: Authenticate and publish to the MCP Registry
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          NAME="$(jq -r '.name' server.json)"
          REGISTRY="https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}&version=latest"
          for i in 1 2 3 4 5; do
            # Fresh token per attempt. A login failure is not fatal on its own:
            # if the Registry is down it will fail here too, and the next attempt
            # after the backoff is the one that matters.
            ./mcp-publisher login github-oidc || echo "login attempt ${i} failed"
            if ./mcp-publisher publish; then
              exit 0
            fi
            echo "attempt ${i} failed; retrying in $((i * 30)) s"
            sleep $((i * 30))
            REG="$(curl -fsS "$REGISTRY" | jq -r --arg n "$NAME" '[.servers[] | select(.server.name == $n) | .server.version][0] // empty' || true)"
            if [ "$REG" = "$VERSION" ]; then
              echo "The Registry already has ${NAME} ${VERSION}; an earlier attempt landed"
              exit 0
            fi
          done
          echo "FAIL: the MCP Registry refused the publish 5 times"
          exit 1

  # ---------------------------------------------------------------------------
  # Verify — a release is complete only when PyPI AND the MCP Registry both
  # serve the tagged version. If either doesn't within 10 minutes, this run
  # fails: a green run means published everywhere, a red one means not done.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify PyPI and MCP Registry
    needs: [security, registry-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: PyPI and Registry serve the released version
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          PACKAGE="$(jq -r '.packages[0].identifier' server.json)"
          NAME="$(jq -r '.name' server.json)"
          REGISTRY="https://registry.modelcontextprotocol.io/v0/servers?search=${NAME}&version=latest"
          for i in $(seq 1 40); do
            PYPI="$(curl -fsS "https://pypi.org/pypi/${PACKAGE}/json" | jq -r '.info.version' || true)"
            REG="$(curl -fsS "$REGISTRY" | jq -r --arg n "$NAME" '[.servers[] | select(.server.name == $n) | .server.version][0] // empty' || true)"
            echo "attempt ${i}: PyPI=${PYPI:-none} Registry=${REG:-none} want=${VERSION}"
            if [ "$PYPI" = "$VERSION" ] && [ "$REG" = "$VERSION" ]; then
              echo "Published everywhere: ${PACKAGE} ${VERSION} on PyPI and ${NAME} ${VERSION} in the MCP Registry"
              exit 0
            fi
            sleep 15
          done
          echo "FAIL: release incomplete. PyPI=${PYPI:-none} Registry=${REG:-none}, expected ${VERSION}"
          exit 1

  # ---------------------------------------------------------------------------
  # Tag the release, once it is published everywhere. The tag marks the commit on
  # main that was released; nothing is triggered by it. If this job fails after a
  # green verify, the release IS published: re-running this job is safe.
  # ---------------------------------------------------------------------------
  tag:
    name: Tag the release
    needs: [security, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create and push vX.Y.Z
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "${GITHUB_REPOSITORY#*/} ${VERSION}" "$GITHUB_SHA"
          git push origin "v${VERSION}"

      # The tag alone left every Releases page in this org empty. The body is
      # this version's own CHANGELOG section, extracted by heading rather than
      # by line count, because the fleet has three heading styles:
      #   ## [0.4.0] — date    ## [2.0.0] - date    ## 0.2.0 (date)
      # It stops at the next "## " heading, and returns nothing for a version
      # it cannot find -- so a missing section falls back to GitHub's own
      # generated notes rather than publishing the whole changelog.
      #
      # After `verify` by construction: a Release only ever describes a version
      # already confirmed on PyPI and the MCP Registry.
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.security.outputs.version }}"
          python3 - "$VERSION" CHANGELOG.md > /tmp/notes.md <<'EXTRACT'
          import re, sys, pathlib
          ver, path = sys.argv[1], sys.argv[2]
          text = pathlib.Path(path).read_text()
          start = re.search(r'(?m)^##\s+\[?%s\]?\b.*$' % re.escape(ver), text)
          if not start:
              raise SystemExit(0)
          rest = text[start.end():]
          nxt = re.search(r'(?m)^##\s', rest)
          print((rest[:nxt.start()] if nxt else rest).strip())
          EXTRACT

          # A version with a suffix (0.2.1rc1) is a pre-release, not Latest.
          PRE=""
          case "$VERSION" in
            *[!0-9.]*) PRE="--prerelease" ;;
          esac

          if [ -s /tmp/notes.md ]; then
            echo "release notes: this version's CHANGELOG section ($(wc -l < /tmp/notes.md) lines)"
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" \
              --notes-file /tmp/notes.md $PRE
          else
            echo "release notes: no CHANGELOG section for ${VERSION}; using generated notes"
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" \
              --generate-notes $PRE
          fi
