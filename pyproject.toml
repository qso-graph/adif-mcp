[project]
name = "adif-mcp"
version = "1.2.3"
description = "ADIF MCP server — spec parsing, validation, and field enumeration tools"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{name = "KI7MT", email = "maintainers@qso-graph.io"}]
keywords = [
    "amateur-radio", "ham-radio", "adif", "mcp", "model-context-protocol",
    "lotw", "eqsl", "qrz", "qso-logging", "ai-agents",
]
# Support modern CPython, develop on 3.13, run on 3.11+
requires-python = ">=3.10"

# Runtime deps only (keep UI optional; Tkinter is stdlib)
dependencies = [
    "aiofiles>=25.1.0",
    "fastmcp>=4.0,<5",
    "tomli>=2.0; python_version < '3.11'",
]

# Classifiers help downstream tooling/users
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Utilities",
]

[dependency-groups]
dev = [
    "pytest",
    "mypy",
    "ruff",
    "commitizen",
    "pydantic>=2.12.0",
    "jsonschema>=4.25.1",
    "interrogate>=1.7.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.18",
    "mkdocstrings[python]>=0.30.0",
    "pymdown-extensions>=10.10",
    "pymdown-extensions[extra]>=10.10",
    "mkdocs-redirects>=1.2.2",
    "mkdocs-mermaid2-plugin>=1.2.2",
    "mkdocs-git-revision-date-localized-plugin>=1.4.7",
    "cli-test-helpers>=4.1.0",
    "types-aiofiles>=25.1.0.20251011",
    "pytest-asyncio>=1.3.0",
]

# Optional extras (reserved for future use)
[project.optional-dependencies]
dev = [
  "ruff>=0.6.8",
  "mypy>=1.11",
  "interrogate>=1.7.0",
]

test = [
  "pytest>=8.3",
  "cli-test-helpers>=0.3.0",
]

# Convenience bundle
all = [
  "adif-mcp[dev,test]",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/adif-mcp/"
Repository = "https://github.com/qso-graph/adif-mcp"
Issues = "https://github.com/qso-graph/adif-mcp/issues"
"ADIF Specification" = "https://adif.org.uk/317/ADIF_317.htm"

[project.scripts]
adif-mcp = "adif_mcp.cli.__main__:main"

# --------------------------------------------------------------------
# ADIF tool config (OS-agnostic & SSOT-ish; helpers interpret it)
# --------------------------------------------------------------------
[tool.adif]
spec_version = "3.1.7"
features = ["core QSO model", "band/mode/QSL_RCVD enums"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async"
]
asyncio_default_fixture_loop_scope = "function"
#addopts = "-q"

# ----------------
# Dev / QA tooling
# ----------------
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [
    ".venv",
    ".smoke-venv",
    "dist",
    "build",
    ".eggs",
    ".pytest_cache",
    "site",
    "docs/_site",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
# The source tree, so a bare `mypy` checks what CI checks. This said
# `packages = ["adif-mcp"]`, which is not a legal Python package name — a
# hyphen cannot appear in one — so `mypy` with no arguments answered
# "Can't find package 'adif-mcp'" and checked nothing. CI never saw it because
# it passes a path explicitly.
files = ["src"]
disable_error_code = ["annotation-unchecked"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "adif_mcp.cli"
disable_error_code = ["misc"]
ignore_missing_imports = true

[tool.interrogate]
fail-under = 100
verbose = 1
quiet = false
color = true
ignore-init-method = true
ignore-module = false
ignore-magic = true
ignore-private = true
ignore-nested-functions = true
ignore-properties = true
paths = ["src", "test"]
exclude = [".venv", ".smoke-venv", "dist", "build", "site", "docs/_site"]
whitelist-regex = [
    "^test_*"
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
update_changelog_on_bump = true

# -------------
# Build system
# -------------
[build-system]
requires = ["hatchling>=1.21", "tomli>=2.0; python_version < '3.11'"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "src/adif_mcp/dev/build_hooks.py"


[tool.hatch.build.targets.wheel]
packages = ["src/adif_mcp"]
include = [
  "src/adif_mcp/resources/**",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/adif_mcp/**",
  "src/adif_mcp/resources/**",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
  "tests/**",
]
exclude = [
    "scripts/**",
    ".venv/**",
    ".smoke-venv/**",
    "dist/**",
    "build/**",
    ".git/**",
    ".github/**",
    "docs/**",
    "site/**",
    ".ruff_cache/**",
    ".mypy_cache/**",
    ".pytest_cache/**",
]
